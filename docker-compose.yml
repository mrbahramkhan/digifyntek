services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: forge_coop
      MYSQL_USER: forge
      MYSQL_PASSWORD: ${DB_PASSWORD:-forge_change_me}
    volumes:
      - forge_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: forge
      DB_PASSWORD: ${DB_PASSWORD:-forge_change_me}
      DB_NAME: forge_coop
      JWT_SECRET: ${JWT_SECRET:-MUST_SET_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS_XX}
      JWT_EXPIRES: 8h
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      TRUST_PROXY: "1"
      UI_ROOT: /app/phase1
    ports:
      - "4000:4000"

volumes:
  forge_mysql:
