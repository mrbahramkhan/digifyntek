name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Syntax check core modules
        run: |
          node --check src/server.js
          node --check src/ledger/service.js
          node --check src/middleware/auth.js
          node --check src/rbac/matrix.js
      - name: Unit tests (no DB)
        run: npm run test:unit

  integrity-tests:
    name: Ledger integrity (MySQL)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: digifyntek
          MYSQL_USER: digi
          MYSQL_PASSWORD: digi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: digi
      DB_PASSWORD: digi_test
      DB_NAME: digifyntek
      JWT_SECRET: ci-test-secret-not-for-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then break; fi
            sleep 2
          done
      - name: Apply schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS digifyntek; GRANT ALL ON digifyntek.* TO 'digi'@'%'; FLUSH PRIVILEGES;"
          for f in sql/01_schema.sql sql/02_seed.sql sql/06_cbs_core.sql sql/08_eod.sql sql/09_cbs_enterprise.sql; do
            if [ -f "$f" ]; then
              echo "Applying $f"
              mysql -h 127.0.0.1 -udigi -pdigi_test digifyntek < "$f" || true
            fi
          done
      - name: Integrity tests
        run: npm run test:integrity
