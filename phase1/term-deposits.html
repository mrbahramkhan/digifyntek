<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFyntek — Term Deposits</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
  <script>(function(){var t=localStorage.getItem('DIGIFYNTEK_THEME');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="side-brand"><span class="m">D</span> DigiFyntek</div><nav class="nav"></nav></aside>
  <div class="main">
    <header class="topbar">
      <h1>Term deposits</h1>
      <span class="meta">Placement · maturity · premature · GL</span>
      <div class="spacer"></div>
      <button type="button" class="btn" id="btnDue">Maturity due</button>
    </header>
    <div class="workspace">
      <div class="split">
        <div class="panel">
          <div class="panel-h">Portfolio</div>
          <div class="table-wrap">
            <table class="data">
              <thead>
                <tr><th>Ref</th><th>Customer</th><th>Principal</th><th>Rate%</th><th>Maturity</th><th>Status</th></tr>
              </thead>
              <tbody id="tb"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h">Actions</div>
          <div class="panel-b">
            <div class="form-sec" style="margin-top:0">Place TD</div>
            <form id="frmPlace">
              <div class="form-grid">
                <div class="field"><label>Customer ID *</label><input class="inp" id="p_cust" required /></div>
                <div class="field"><label>Funding account ID</label><input class="inp" id="p_fund" placeholder="optional CASA" /></div>
                <div class="field"><label>Principal *</label><input class="inp" type="number" step="0.01" id="p_prin" required /></div>
                <div class="field"><label>Rate / profit % p.a.</label><input class="inp" type="number" step="0.01" id="p_rate" value="12" /></div>
                <div class="field"><label>Tenor (days) *</label><input class="inp" type="number" id="p_tenor" value="365" required /></div>
                <div class="field"><label>Value date</label><input class="inp" type="date" id="p_vdate" /></div>
                <div class="field"><label>Product</label>
                  <select class="inp" id="p_prod">
                    <optgroup label="Conventional TD">
                      <option value="TD-PKR">TD-PKR — Term deposit</option>
                      <option value="TD-PKR-6M">TD-PKR-6M — 6 month TD</option>
                    </optgroup>
                    <optgroup label="Islamic TD">
                      <option value="TD-ISL">TD-ISL — Islamic term deposit</option>
                      <option value="TD-ISL-MUD">TD-ISL-MUD — Mudaraba TD</option>
                      <option value="TD-ISL-WAK">TD-ISL-WAK — Wakala TD</option>
                    </optgroup>
                  </select>
                </div>
                <div class="field"><label>WHT %</label><input class="inp" type="number" step="0.01" id="p_wht" value="0" /></div>
                <div class="field"><label>Rollover</label>
                  <select class="inp" id="p_roll">
                    <option value="NONE">NONE</option>
                    <option value="PRINCIPAL">PRINCIPAL</option>
                    <option value="PRINCIPAL_INTEREST">PRINCIPAL_INTEREST</option>
                  </select>
                </div>
                <div class="field"><label>Branch</label><input class="inp" id="p_br" value="001" /></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn btn-p">Place deposit</button></div>
            </form>

            <div class="form-sec">Settle selected</div>
            <div class="form-grid">
              <div class="field"><label>TD ID *</label><input class="inp" id="s_id" /></div>
              <div class="field"><label>Credit account ID</label><input class="inp" id="s_acct" /></div>
              <div class="field full">
                <label style="display:flex;gap:8px;align-items:center;font-weight:500">
                  <input type="checkbox" id="s_int" /> Allow interest/profit on premature
                </label>
              </div>
            </div>
            <div class="form-actions">
              <button type="button" class="btn btn-p" id="btnMature">Mature / payout</button>
              <button type="button" class="btn" id="btnPre">Premature encash</button>
            </div>
            <div id="msg" class="hint"></div>
          </div>
        </div>
      </div>
      <pre id="detail" style="display:none;margin-top:12px;background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;font-size:11px;max-height:260px;overflow:auto"></pre>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  p_vdate.value = new Date().toISOString().slice(0, 10);
  function fmt(n) { return Number(n || 0).toLocaleString('en-PK', { maximumFractionDigits: 2 }); }
  function tag(s) {
    var m = { active: 'tag-g', matured: 'tag-n', encashed: 'tag-a', cancelled: 'tag-r' };
    return '<span class="tag ' + (m[s] || 'tag-n') + '">' + s + '</span>';
  }
  function flash(ok, t) { msg.textContent = t; msg.className = ok ? 'ok' : 'err'; }

  async function load() {
    try {
      var rows = await DigiFyntekAPI.request('/api/v1/term-deposits');
      tb.innerHTML = rows.length
        ? rows.map(function (r) {
            return (
              '<tr data-id="' + r.id + '" style="cursor:pointer">' +
              '<td class="num">' + r.td_ref + '</td>' +
              '<td>' + (r.full_name || r.customer_id) + '</td>' +
              '<td class="num">' + fmt(r.principal) + '</td>' +
              '<td class="num">' + r.rate_pct + '</td>' +
              '<td>' + String(r.maturity_date).slice(0, 10) + '</td>' +
              '<td>' + tag(r.status) + '</td></tr>'
            );
          }).join('')
        : '<tr><td colspan="6" class="empty">No term deposits</td></tr>';
    } catch (e) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">' + e.message + '</td></tr>';
    }
  }

  tb.onclick = async function (e) {
    var tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    s_id.value = tr.getAttribute('data-id');
    try {
      var d = await DigiFyntekAPI.request('/api/v1/term-deposits/' + s_id.value);
      detail.style.display = 'block';
      detail.textContent = JSON.stringify(d, null, 2);
    } catch (err) {
      flash(false, err.message);
    }
  };

  frmPlace.onsubmit = async function (e) {
    e.preventDefault();
    try {
      var r = await DigiFyntekAPI.request('/api/v1/term-deposits', {
        method: 'POST',
        body: JSON.stringify({
          customer_id: Number(p_cust.value),
          funding_account_id: p_fund.value ? Number(p_fund.value) : null,
          principal: Number(p_prin.value),
          rate_pct: Number(p_rate.value),
          tenor_days: Number(p_tenor.value),
          value_date: p_vdate.value,
          product_code: p_prod.value,
          withholding_tax_pct: Number(p_wht.value) || 0,
          rollover_instruction: p_roll.value,
          branch_code: p_br.value,
          is_islamic: p_prod.value.indexOf('TD-ISL') === 0,
        }),
      });
      flash(true, 'Placed ' + r.td_ref + ' · matures ' + r.maturity_date);
      load();
    } catch (err) {
      flash(false, err.message);
    }
  };

  btnMature.onclick = async function () {
    if (!s_id.value) return;
    try {
      var r = await DigiFyntekAPI.request('/api/v1/term-deposits/' + s_id.value + '/mature', {
        method: 'POST',
        body: JSON.stringify({ credit_account_id: s_acct.value ? Number(s_acct.value) : null }),
      });
      flash(true, 'Matured · payout ' + r.payout + ' (interest ' + r.interest + ', WHT ' + r.withholding_tax + ')');
      load();
    } catch (err) {
      flash(false, err.message);
    }
  };

  btnPre.onclick = async function () {
    if (!s_id.value) return;
    if (!confirm('Premature encashment?')) return;
    try {
      var r = await DigiFyntekAPI.request('/api/v1/term-deposits/' + s_id.value + '/premature', {
        method: 'POST',
        body: JSON.stringify({
          credit_account_id: s_acct.value ? Number(s_acct.value) : null,
          allow_interest: s_int.checked,
        }),
      });
      flash(true, 'Encashed · payout ' + r.payout);
      load();
    } catch (err) {
      flash(false, err.message);
    }
  };

  btnDue.onclick = async function () {
    try {
      var d = await DigiFyntekAPI.request('/api/v1/term-deposits/meta/due');
      detail.style.display = 'block';
      detail.textContent = JSON.stringify(d, null, 2);
    } catch (err) {
      flash(false, err.message);
    }
  };

  load();
})();
</script>
</body>
</html>
