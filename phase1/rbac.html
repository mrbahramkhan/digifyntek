<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DigiFyntek — Roles & Permissions</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tabs button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line,#e2e8f0);
      background: var(--panel,#fff); cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .tabs button.active { background: #1d4ed8; color: #fff; border-color: transparent; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); gap: 10px; }
    .field label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 4px; }
    .inp { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line,#e2e8f0); }
    .perm-list { max-height: 280px; overflow: auto; border: 1px solid var(--line,#e2e8f0); border-radius: 8px; padding: 8px; }
    .perm-list label { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 12px; }
    .msg { font-size: 12px; margin-top: 8px; }
    .msg.ok { color: #059669; } .msg.err { color: #dc2626; }
    table.data { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.data th, table.data td { border-bottom: 1px solid var(--line,#e2e8f0); padding: 8px; text-align: left; }
  </style>
  <script>
    (function(){var t=localStorage.getItem('DIGIFYNTEK_THEME');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-brand"><span class="m">D</span> DigiFyntek</div>
    <nav class="nav">
      <a href="app.html">← Workbench</a>
      <a href="rbac.html" class="active">Roles & permissions</a>
      <a href="role-assignment.html">Assignment (legacy)</a>
      <a href="role-management.html">Management (legacy)</a>
    </nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1>Roles & Permissions</h1>
      <span class="meta">RBAC · assign · matrix · CRUD</span>
      <div class="spacer"></div>
      <button type="button" class="btn" id="btnLogout">Logout</button>
    </header>
    <div class="workspace">
      <div class="panel" style="margin-bottom:12px">
        <div class="panel-b">
          <div id="meBox" class="hint">Loading session…</div>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button type="button" data-tab="assign" class="active">Assign roles</button>
        <button type="button" data-tab="roles">Manage roles</button>
        <button type="button" data-tab="matrix">Permission matrix</button>
      </div>

      <!-- ASSIGN -->
      <div class="tab-pane active" id="tab-assign">
        <div class="grid2">
          <div class="panel">
            <div class="panel-h">Users</div>
            <div class="panel-b">
              <input class="inp" id="userQ" placeholder="Filter users…" style="margin-bottom:8px" />
              <div class="table-wrap" style="max-height:400px;overflow:auto">
                <table class="data"><thead><tr><th>User</th><th>Name</th><th>Role</th></tr></thead>
                <tbody id="userTb"></tbody></table>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h">Assign role</div>
            <div class="panel-b">
              <div class="form-grid">
                <div class="field full"><label>User ID</label><input class="inp" id="as_user" readonly /></div>
                <div class="field full"><label>Role</label>
                  <select class="inp" id="as_role"></select>
                </div>
              </div>
              <div style="margin-top:12px">
                <button type="button" class="btn btn-p" id="btnAssign">Save role</button>
              </div>
              <div class="hint" id="asPreview" style="margin-top:10px"></div>
              <div class="msg" id="asMsg"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ROLES CRUD -->
      <div class="tab-pane" id="tab-roles">
        <div class="grid2">
          <div class="panel">
            <div class="panel-h">Roles</div>
            <div class="panel-b">
              <div class="table-wrap" style="max-height:360px;overflow:auto">
                <table class="data"><thead><tr><th>Code</th><th>Name</th><th>System</th></tr></thead>
                <tbody id="roleTb"></tbody></table>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h">Create / edit role</div>
            <div class="panel-b">
              <div class="form-grid">
                <div class="field"><label>Role code</label><input class="inp" id="r_code" placeholder="e.g. branch_ops" /></div>
                <div class="field"><label>Role name</label><input class="inp" id="r_name" /></div>
                <div class="field full"><label>Description</label><input class="inp" id="r_desc" /></div>
              </div>
              <div class="hint" style="margin:10px 0 6px">Permissions</div>
              <div class="perm-list" id="permChecks"></div>
              <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
                <button type="button" class="btn btn-p" id="btnRoleSave">Save role</button>
                <button type="button" class="btn" id="btnRoleClone">Clone selected</button>
                <button type="button" class="btn" id="btnRoleDel">Delete</button>
                <button type="button" class="btn" id="btnRoleNew">Clear</button>
              </div>
              <div class="msg" id="roleMsg"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- MATRIX -->
      <div class="tab-pane" id="tab-matrix">
        <div class="panel">
          <div class="panel-h">Matrix (role × permission)</div>
          <div class="panel-b table-wrap" style="overflow:auto;max-height:520px">
            <table class="data" id="matrixTable"><thead></thead><tbody></tbody></table>
          </div>
          <div class="msg" id="mxMsg"></div>
        </div>
      </div>

    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/rbac.js"></script>
<script>
(function () {
  if (!window.DigiFyntekAPI || !DigiFyntekAPI.token()) {
    location.replace('login.html?next=rbac.html');
    return;
  }
  document.getElementById('btnLogout').onclick = function () { DigiFyntekAPI.logout(); };

  var users = [], roles = [], permissions = [], matrix = {};
  var selectedRole = null;

  document.getElementById('tabs').onclick = function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    document.querySelectorAll('#tabs button').forEach(function (x) {
      x.classList.toggle('active', x === b);
    });
    document.querySelectorAll('.tab-pane').forEach(function (p) {
      p.classList.toggle('active', p.id === 'tab-' + b.getAttribute('data-tab'));
    });
    if (b.getAttribute('data-tab') === 'matrix') renderMatrix();
  };

  function msg(id, text, ok) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  async function loadMe() {
    try {
      var me = await DigiFyntekAPI.request('/api/v1/rbac/me');
      document.getElementById('meBox').innerHTML =
        '<strong>' + (me.userId || '') + '</strong> · role <code>' + (me.role || '') + '</code> · ' +
        (me.is_super ? 'full access (*)' : (me.permissions || []).length + ' permissions');
      if (window.DigiFyntekRBAC) {
        try {
          localStorage.setItem('DIGIFYNTEK_PERMS', JSON.stringify(me.permissions || []));
          localStorage.setItem('DIGIFYNTEK_ROLE', me.role || '');
        } catch (e) {}
      }
    } catch (e) {
      document.getElementById('meBox').textContent = e.message || e;
    }
  }

  async function loadAll() {
    roles = await DigiFyntekAPI.request('/api/v1/rbac/roles');
    if (!Array.isArray(roles)) roles = [];
    permissions = await DigiFyntekAPI.request('/api/v1/rbac/permissions');
    if (!Array.isArray(permissions)) permissions = [];
    try {
      users = await DigiFyntekAPI.request('/api/v1/rbac/users');
      if (!Array.isArray(users)) users = [];
    } catch (e) {
      users = [];
      msg('asMsg', e.message || 'Cannot load users (need admin.rbac)', false);
    }
    try {
      var mx = await DigiFyntekAPI.request('/api/v1/rbac/matrix');
      matrix = mx.matrix || {};
      if (mx.roles) roles = mx.roles;
      if (mx.permissions) permissions = mx.permissions;
    } catch (e) {
      matrix = {};
    }
    fillRoleSelect();
    renderUsers();
    renderRoles();
    renderPermChecks();
  }

  function fillRoleSelect() {
    var sel = document.getElementById('as_role');
    sel.innerHTML = roles.map(function (r) {
      var code = r.role_code || r;
      var name = r.role_name || code;
      return '<option value="' + code + '">' + name + ' (' + code + ')</option>';
    }).join('');
  }

  function renderUsers() {
    var q = (document.getElementById('userQ').value || '').toLowerCase();
    var rows = users.filter(function (u) {
      return !q || [u.user_id, u.full_name, u.role].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    document.getElementById('userTb').innerHTML = rows.map(function (u) {
      return '<tr data-uid="' + (u.user_id || u.id) + '" style="cursor:pointer">' +
        '<td>' + (u.user_id || u.id) + '</td><td>' + (u.full_name || '') + '</td><td>' +
        (u.role || '') + '</td></tr>';
    }).join('') || '<tr><td colspan="3">No users</td></tr>';
  }
  document.getElementById('userQ').oninput = renderUsers;
  document.getElementById('userTb').onclick = function (e) {
    var tr = e.target.closest('tr[data-uid]');
    if (!tr) return;
    var u = users.find(function (x) { return String(x.user_id || x.id) === tr.dataset.uid; });
    if (!u) return;
    document.getElementById('as_user').value = u.user_id || u.id;
    document.getElementById('as_role').value = u.role || 'viewer';
    previewPerms(u.role);
  };
  document.getElementById('as_role').onchange = function () {
    previewPerms(this.value);
  };
  async function previewPerms(role) {
    try {
      var mx = matrix[role] || [];
      if (!mx.length && role) {
        // fallback from me-style: load matrix again not needed
      }
      document.getElementById('asPreview').textContent =
        'Permissions for ' + role + ': ' + (matrix[role] ? matrix[role].join(', ') : '(see matrix tab)');
    } catch (e) {}
  }

  document.getElementById('btnAssign').onclick = async function () {
    var userId = document.getElementById('as_user').value.trim();
    var role = document.getElementById('as_role').value;
    if (!userId) return msg('asMsg', 'Select a user', false);
    try {
      var u = await DigiFyntekAPI.request('/api/v1/rbac/users/' + encodeURIComponent(userId) + '/role', {
        method: 'PATCH',
        body: JSON.stringify({ role: role })
      });
      msg('asMsg', 'Role saved: ' + (u.user_id || userId) + ' → ' + u.role, true);
      await loadAll();
    } catch (e) {
      msg('asMsg', e.message || e, false);
    }
  };

  function renderRoles() {
    document.getElementById('roleTb').innerHTML = roles.map(function (r) {
      return '<tr data-code="' + r.role_code + '" style="cursor:pointer"><td>' + r.role_code +
        '</td><td>' + (r.role_name || '') + '</td><td>' + (r.is_system ? 'yes' : 'no') + '</td></tr>';
    }).join('');
  }
  document.getElementById('roleTb').onclick = function (e) {
    var tr = e.target.closest('tr[data-code]');
    if (!tr) return;
    selectedRole = tr.dataset.code;
    var r = roles.find(function (x) { return x.role_code === selectedRole; });
    document.getElementById('r_code').value = selectedRole;
    document.getElementById('r_name').value = r ? (r.role_name || '') : '';
    document.getElementById('r_desc').value = r ? (r.description || '') : '';
    var granted = matrix[selectedRole] || [];
    document.querySelectorAll('#permChecks input[type=checkbox]').forEach(function (cb) {
      cb.checked = granted.includes('*') || granted.includes(cb.value);
    });
  };

  function renderPermChecks() {
    document.getElementById('permChecks').innerHTML = permissions.map(function (p) {
      var code = p.perm_code || p;
      return '<label><input type="checkbox" value="' + code + '" /> <code>' + code + '</code> ' +
        (p.description || '') + '</label>';
    }).join('') || '<div class="hint">No permissions in DB — fallback matrix still works on API</div>';
  }

  document.getElementById('btnRoleNew').onclick = function () {
    selectedRole = null;
    document.getElementById('r_code').value = '';
    document.getElementById('r_name').value = '';
    document.getElementById('r_desc').value = '';
    document.querySelectorAll('#permChecks input').forEach(function (cb) { cb.checked = false; });
  };

  document.getElementById('btnRoleSave').onclick = async function () {
    var code = document.getElementById('r_code').value.trim().toLowerCase();
    var name = document.getElementById('r_name').value.trim();
    var desc = document.getElementById('r_desc').value.trim();
    if (!code || !name) return msg('roleMsg', 'Code and name required', false);
    var perms = [];
    document.querySelectorAll('#permChecks input:checked').forEach(function (cb) {
      perms.push(cb.value);
    });
    try {
      // create or update role
      try {
        await DigiFyntekAPI.request('/api/v1/rbac/roles', {
          method: 'POST',
          body: JSON.stringify({ role_code: code, role_name: name, description: desc })
        });
      } catch (e) {
        // may already exist — try patch name
        try {
          await DigiFyntekAPI.request('/api/v1/rbac/roles/' + encodeURIComponent(code), {
            method: 'PATCH',
            body: JSON.stringify({ role_name: name, description: desc })
          });
        } catch (e2) {}
      }
      // set permissions (replace)
      await DigiFyntekAPI.request('/api/v1/rbac/roles/' + encodeURIComponent(code) + '/permissions/set', {
        method: 'PUT',
        body: JSON.stringify({ permissions: perms })
      }).catch(async function () {
        // fallback grant one by one
        for (var i = 0; i < perms.length; i++) {
          await DigiFyntekAPI.request('/api/v1/rbac/roles/' + encodeURIComponent(code) + '/permissions', {
            method: 'POST',
            body: JSON.stringify({ perm_code: perms[i] })
          });
        }
      });
      msg('roleMsg', 'Role saved: ' + code, true);
      await loadAll();
    } catch (e) {
      msg('roleMsg', e.message || e, false);
    }
  };

  document.getElementById('btnRoleClone').onclick = async function () {
    if (!selectedRole) return msg('roleMsg', 'Select a role first', false);
    try {
      var r = await DigiFyntekAPI.request('/api/v1/rbac/roles/' + encodeURIComponent(selectedRole) + '/clone', {
        method: 'POST',
        body: JSON.stringify({})
      });
      msg('roleMsg', 'Cloned → ' + r.role_code, true);
      await loadAll();
    } catch (e) {
      msg('roleMsg', e.message || e, false);
    }
  };

  document.getElementById('btnRoleDel').onclick = async function () {
    var code = document.getElementById('r_code').value.trim();
    if (!code) return msg('roleMsg', 'Select role', false);
    if (!confirm('Delete role ' + code + '?')) return;
    try {
      await DigiFyntekAPI.request('/api/v1/rbac/roles/' + encodeURIComponent(code), { method: 'DELETE' });
      msg('roleMsg', 'Deleted ' + code, true);
      document.getElementById('btnRoleNew').click();
      await loadAll();
    } catch (e) {
      msg('roleMsg', e.message || e, false);
    }
  };

  function renderMatrix() {
    var roleCodes = roles.map(function (r) { return r.role_code; });
    var perms = permissions.map(function (p) { return p.perm_code || p; });
    if (!perms.length) {
      // derive from matrix values
      var set = {};
      Object.keys(matrix).forEach(function (rk) {
        (matrix[rk] || []).forEach(function (p) { if (p !== '*') set[p] = 1; });
      });
      perms = Object.keys(set).sort();
    }
    var thead = '<tr><th>Permission</th>' + roleCodes.map(function (r) {
      return '<th>' + r + '</th>';
    }).join('') + '</tr>';
    var tbody = perms.map(function (p) {
      return '<tr><td><code>' + p + '</code></td>' + roleCodes.map(function (r) {
        var list = matrix[r] || [];
        var ok = list.includes('*') || list.includes(p);
        return '<td style="text-align:center">' + (ok ? '✓' : '') + '</td>';
      }).join('') + '</tr>';
    }).join('');
    document.querySelector('#matrixTable thead').innerHTML = thead;
    document.querySelector('#matrixTable tbody').innerHTML = tbody || '<tr><td>No data</td></tr>';
  }

  loadMe();
  loadAll().catch(function (e) {
    msg('asMsg', e.message || e, false);
  });
})();
</script>
</body>
</html>
