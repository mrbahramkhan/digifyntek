<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFyntek — Internal Transfer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
  <script>(function(){var t=localStorage.getItem('DIGIFYNTEK_THEME');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="side-brand"><span class="m">D</span> DigiFyntek</div><nav class="nav"></nav></aside>
  <div class="main">
    <header class="topbar"><h1>Internal fund transfer</h1><span class="meta">Atomic · balanced journal · idempotent</span></header>
    <div class="workspace">
      <div class="panel" style="max-width:480px">
        <div class="panel-h">Transfer form</div>
        <div class="panel-b">
          <form id="frm">
            <div class="form-grid">
              <div class="field full"><label>From account ID <span class="req">*</span></label><input class="inp" id="f_from" required /></div>
              <div class="field full"><label>To account ID <span class="req">*</span></label><input class="inp" id="f_to" required /></div>
              <div class="field"><label>Amount (PKR) <span class="req">*</span></label><input class="inp" type="number" step="0.01" id="f_amt" required /></div>
              <div class="field"><label>Business date</label><input class="inp" type="date" id="f_date" /></div>
              <div class="field full"><label>Narrative</label><input class="inp" id="f_narr" /></div>
              <div class="field full"><label>Idempotency key (optional)</label><input class="inp" id="f_idem" placeholder="unique-key-to-prevent-duplicate" /></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn btn-p">Post transfer</button></div>
            <div id="msg" class="hint"></div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script><script src="js/api.js"></script><script src="js/shell.js"></script>
<script>
document.getElementById('f_date').value=new Date().toISOString().slice(0,10);
document.getElementById('frm').onsubmit=async e=>{
  e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Posting…';
  try{
    const r=await DigiFyntekAPI.request('/api/v1/ledger/transfers',{method:'POST',body:JSON.stringify({
      from_account_id:Number(f_from.value),to_account_id:Number(f_to.value),
      amount:Number(f_amt.value),business_date:f_date.value,narrative:f_narr.value,
      idempotency_key:f_idem.value||undefined
    })});
    msg.textContent='Posted '+r.transfer_ref+' · journal '+r.journal_ref;msg.className='ok';
  }catch(err){msg.textContent=err.message;msg.className='err';}
};
</script>
</body>
</html>
