<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFyntek — Member Register</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
  <script>(function(){var t=localStorage.getItem('DIGIFYNTEK_THEME');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-brand"><span class="m">D</span> DigiFyntek</div>
    <nav class="nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1>Member register</h1>
      <span class="meta">CRM · data entry</span>
      <div class="spacer"></div>
      <button type="button" class="btn btn-p" id="btnNew">+ New member</button>
    </header>
    <div class="workspace">
      <div class="kpis">
        <div class="kpi"><div class="l">Total</div><div class="v" id="kTotal">—</div></div>
        <div class="kpi"><div class="l">Active</div><div class="v" id="kActive">—</div></div>
        <div class="kpi"><div class="l">Farmers</div><div class="v" id="kFarmers">—</div></div>
        <div class="kpi"><div class="l">Selected</div><div class="v" id="kSel">—</div></div>
      </div>

      <div class="split">
        <!-- LIST -->
        <div class="panel">
          <div class="panel-h">
            <span>Members</span>
            <div class="spacer"></div>
            <input class="inp" id="q" placeholder="Search name / CNIC / phone" style="width:220px;height:28px" />
          </div>
          <div class="table-wrap">
            <table class="data" id="tbl">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Name</th>
                  <th>CNIC</th>
                  <th>Phone</th>
                  <th>Branch</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tb"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>

        <!-- FORM -->
        <div class="panel" id="formPanel">
          <div class="panel-h"><span id="formTitle">Member form</span></div>
          <div class="panel-b">
            <form id="frm" autocomplete="off">
              <input type="hidden" name="id" id="f_id" />

              <div class="form-sec">Identity</div>
              <div class="form-grid">
                <div class="field full">
                  <label>Full name <span class="req">*</span></label>
                  <input class="inp" name="full_name" id="f_name" required />
                </div>
                <div class="field">
                  <label>CNIC <span class="req">*</span></label>
                  <input class="inp" name="cnic" id="f_cnic" placeholder="xxxxx-xxxxxxx-x" required />
                </div>
                <div class="field">
                  <label>Mobile <span class="req">*</span></label>
                  <input class="inp" name="phone" id="f_phone" placeholder="03xx-xxxxxxx" required />
                </div>
                <div class="field">
                  <label>Father / husband</label>
                  <input class="inp" name="father_name" id="f_father" />
                </div>
                <div class="field">
                  <label>Date of birth</label>
                  <input class="inp" type="date" name="dob" id="f_dob" />
                </div>
                <div class="field">
                  <label>Gender</label>
                  <select class="inp" name="gender" id="f_gender">
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="O">Other</option>
                  </select>
                </div>
                <div class="field">
                  <label>Member type</label>
                  <select class="inp" name="is_farmer" id="f_farmer">
                    <option value="1">Farmer</option>
                    <option value="0">Non-farmer / general</option>
                  </select>
                </div>
              </div>

              <div class="form-sec">Branch & status</div>
              <div class="form-grid">
                <div class="field">
                  <label>Branch code</label>
                  <input class="inp" name="vac_code" id="f_branch" placeholder="e.g. 0056" />
                </div>
                <div class="field">
                  <label>Status</label>
                  <select class="inp" name="status" id="f_status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="suspended">Suspended</option>
                  </select>
                </div>
                <div class="field">
                  <label>Join date</label>
                  <input class="inp" type="date" name="joined_at" id="f_joined" />
                </div>
                <div class="field">
                  <label>Member code</label>
                  <input class="inp" name="member_code" id="f_code" placeholder="Auto if blank" />
                </div>
              </div>

              <div class="form-sec">Address</div>
              <div class="form-grid">
                <div class="field full">
                  <label>Address</label>
                  <textarea class="inp" name="address" id="f_address" rows="2"></textarea>
                </div>
              </div>

              <div class="form-actions">
                <button type="button" class="btn" id="btnReset">Clear</button>
                <button type="submit" class="btn btn-p" id="btnSave">Save member</button>
              </div>
              <div id="msg" class="hint"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
(function () {
  let rows = [];
  let selectedId = null;

  function statusTag(s) {
    const v = (s || 'active').toLowerCase();
    const c = v === 'active' ? 'tag-g' : v === 'suspended' ? 'tag-r' : 'tag-n';
    return '<span class="tag ' + c + '">' + v + '</span>';
  }

  function render() {
    const q = (document.getElementById('q').value || '').toLowerCase().trim();
    const filtered = !q ? rows : rows.filter(function (r) {
      return [r.full_name, r.cnic, r.phone, r.member_code, r.vac_code]
        .join(' ').toLowerCase().indexOf(q) >= 0;
    });
    const tb = document.getElementById('tb');
    if (!filtered.length) {
      tb.innerHTML = '<tr><td colspan="6" class="empty">No members found</td></tr>';
    } else {
      tb.innerHTML = filtered.map(function (r) {
        const id = r.id || r.member_code;
        const sel = id === selectedId ? ' sel' : '';
        return '<tr class="' + sel + '" data-id="' + id + '">' +
          '<td class="num">' + (r.member_code || id || '—') + '</td>' +
          '<td>' + (r.full_name || '—') + '</td>' +
          '<td class="muted">' + (r.cnic || '—') + '</td>' +
          '<td class="muted">' + (r.phone || '—') + '</td>' +
          '<td class="num">' + (r.vac_code || '—') + '</td>' +
          '<td>' + statusTag(r.status) + '</td></tr>';
      }).join('');
    }
    document.getElementById('kTotal').textContent = rows.length;
    document.getElementById('kActive').textContent = rows.filter(function (r) {
      return (r.status || 'active').toLowerCase() === 'active';
    }).length;
    document.getElementById('kFarmers').textContent = rows.filter(function (r) {
      return r.is_farmer;
    }).length;
    document.getElementById('kSel').textContent = selectedId || '—';
  }

  function fillForm(r) {
    selectedId = r ? (r.id || r.member_code) : null;
    document.getElementById('formTitle').textContent = r ? 'Edit member' : 'New member';
    document.getElementById('f_id').value = r ? (r.id || '') : '';
    document.getElementById('f_name').value = r ? (r.full_name || '') : '';
    document.getElementById('f_cnic').value = r ? (r.cnic || '') : '';
    document.getElementById('f_phone').value = r ? (r.phone || '') : '';
    document.getElementById('f_father').value = r ? (r.father_name || '') : '';
    document.getElementById('f_dob').value = r && r.dob ? String(r.dob).slice(0, 10) : '';
    document.getElementById('f_gender').value = r ? (r.gender || 'M') : 'M';
    document.getElementById('f_farmer').value = r && r.is_farmer === false ? '0' : '1';
    document.getElementById('f_branch').value = r ? (r.vac_code || '') : '';
    document.getElementById('f_status').value = r ? (r.status || 'active') : 'active';
    document.getElementById('f_joined').value = r && r.joined_at ? String(r.joined_at).slice(0, 10) : '';
    document.getElementById('f_code').value = r ? (r.member_code || '') : '';
    document.getElementById('f_address').value = r ? (r.address || '') : '';
    document.getElementById('msg').textContent = '';
    render();
  }

  async function load() {
    try {
      const data = await DigiFyntekAPI.request('/api/members?limit=500');
      rows = Array.isArray(data) ? data : (data.items || data.rows || []);
      render();
    } catch (e) {
      document.getElementById('tb').innerHTML =
        '<tr><td colspan="6" class="empty">' + (e.message || 'Failed to load') + '</td></tr>';
    }
  }

  document.getElementById('tb').addEventListener('click', function (e) {
    const tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    const id = tr.getAttribute('data-id');
    const r = rows.find(function (x) { return String(x.id) === id || String(x.member_code) === id; });
    if (r) fillForm(r);
  });

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('btnNew').onclick = function () { fillForm(null); };
  document.getElementById('btnReset').onclick = function () { fillForm(null); };

  document.getElementById('frm').onsubmit = async function (e) {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const body = {
      full_name: document.getElementById('f_name').value.trim(),
      cnic: document.getElementById('f_cnic').value.trim(),
      phone: document.getElementById('f_phone').value.trim(),
      father_name: document.getElementById('f_father').value.trim(),
      dob: document.getElementById('f_dob').value || null,
      gender: document.getElementById('f_gender').value,
      is_farmer: document.getElementById('f_farmer').value === '1',
      vac_code: document.getElementById('f_branch').value.trim(),
      status: document.getElementById('f_status').value,
      joined_at: document.getElementById('f_joined').value || null,
      member_code: document.getElementById('f_code').value.trim() || undefined,
      address: document.getElementById('f_address').value.trim(),
    };
    const id = document.getElementById('f_id').value;
    msg.textContent = 'Saving…';
    msg.className = 'hint';
    try {
      if (id) {
        await DigiFyntekAPI.request('/api/members/' + encodeURIComponent(id), {
          method: 'PUT',
          body: JSON.stringify(body),
        });
      } else {
        await DigiFyntekAPI.request('/api/members', {
          method: 'POST',
          body: JSON.stringify(body),
        });
      }
      msg.textContent = 'Saved.';
      msg.className = 'ok';
      await load();
    } catch (err) {
      msg.textContent = err.message || 'Save failed';
      msg.className = 'err';
    }
  };

  load();
})();
</script>
</body>
</html>
