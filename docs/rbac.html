<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RBAC — DigiFyntek</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>(function(){var t=localStorage.getItem("DIGIFYNTEK_THEME");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");})();</script>
  <style>
    .rbac-me{padding:12px 14px;border-radius:12px;border:1px solid var(--line,#e5e7eb);background:var(--panel,#fff);margin-bottom:14px;font-size:13px}
    .matrix-wrap{overflow:auto;max-height:420px;border:1px solid var(--line,#e5e7eb);border-radius:10px}
    .matrix{border-collapse:collapse;font-size:11px;min-width:100%}
    .matrix th,.matrix td{border:1px solid var(--line,#e5e7eb);padding:4px 6px;text-align:center}
    .matrix th{position:sticky;top:0;background:var(--panel,#f8fafc);z-index:1}
    .matrix td.perm{text-align:left;font-family:ui-monospace,monospace;white-space:nowrap}
    .matrix .yes{color:#15803d;font-weight:700}
    .matrix .no{color:#cbd5e1}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="side-brand"><span class="m">D</span> DigiFyntek</div><nav class="nav"></nav></aside>
  <div class="main">
    <header class="topbar"><h1>Role-based access control</h1><span class="meta">Roles · permissions · user assignment</span><div class="spacer"></div></header>
    <div class="workspace">
      <div class="rbac-me" id="meBox">Loading…</div>
      <div class="layout-2">
        <div class="panel">
          <div class="panel-h">Users · assign role</div>
          <div class="panel-b">
            <div class="form-grid">
              <div class="field"><label>User</label><select class="inp" id="uSel"></select></div>
              <div class="field"><label>Role</label><select class="inp" id="rSel"></select></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-p" type="button" onclick="assignRole()">Save role</button>
              <button class="btn" type="button" onclick="loadUsers()">Refresh</button>
            </div>
            <div id="msg" class="hint"></div>
            <div class="table-wrap" style="margin-top:12px">
              <table class="data"><thead><tr><th>User</th><th>Name</th><th>Role</th><th>Active</th></tr></thead>
              <tbody id="uTb"></tbody></table>
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h">Grant / revoke permission</div>
          <div class="panel-b">
            <div class="form-grid">
              <div class="field"><label>Role</label><select class="inp" id="gRole"></select></div>
              <div class="field"><label>Permission</label><select class="inp" id="gPerm"></select></div>
            </div>
            <div class="form-actions">
              <button class="btn btn-p" type="button" onclick="grant()">Grant</button>
              <button class="btn" type="button" onclick="revoke()">Revoke</button>
              <button class="btn" type="button" onclick="loadMatrix()">Refresh matrix</button>
            </div>
            <div id="msg2" class="hint"></div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:14px">
        <div class="panel-h">Permission matrix</div>
        <div class="panel-b"><div class="matrix-wrap" id="matrixBox">Loading…</div></div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script>
async function loadMe(){
  try{
    var m=await DigiFyntekAPI.request("/api/v1/rbac/me");
    document.getElementById("meBox").innerHTML="<strong>Signed in as</strong> <code>"+(m.userId||"")+"</code> · role <code>"+(m.role||"")+"</code>"+(m.is_super?" · <strong>full access (*)</strong>":"")+"<div style=\"margin-top:8px;font-size:11px;color:var(--ink-2,#64748b)\">"+(m.permissions||[]).join(", ")+"</div>";
  }catch(e){document.getElementById("meBox").textContent=e.message||e;}
}
function fill(sel,items,val,lab){
  sel.innerHTML=items.map(function(i){var v=i[val]||i.role_code||i.perm_code;var l=i[lab]||i.role_name||i.description||v;return "<option value=\""+v+"\">"+v+(l&&l!==v?" — "+l:"")+"</option>";}).join("");
}
async function loadRolesPerms(){
  var roles=await DigiFyntekAPI.request("/api/v1/rbac/roles");
  var perms=await DigiFyntekAPI.request("/api/v1/rbac/permissions");
  if(!Array.isArray(roles))roles=[];
  if(!Array.isArray(perms))perms=[];
  fill(document.getElementById("rSel"),roles,"role_code","role_name");
  fill(document.getElementById("gRole"),roles.filter(function(r){return r.role_code!=="superadmin";}),"role_code","role_name");
  fill(document.getElementById("gPerm"),perms,"perm_code","description");
}
async function loadUsers(){
  try{
    var rows=await DigiFyntekAPI.request("/api/v1/rbac/users");
    if(!Array.isArray(rows))rows=[];
    document.getElementById("uSel").innerHTML=rows.map(function(u){return "<option value=\""+u.user_id+"\">"+u.user_id+" ("+(u.role||"")+")</option>";}).join("");
    document.getElementById("uTb").innerHTML=rows.map(function(u){return "<tr><td>"+u.user_id+"</td><td>"+(u.full_name||"")+"</td><td>"+u.role+"</td><td>"+(u.is_active?"Y":"N")+"</td></tr>";}).join("")||"<tr><td colspan=4 class=empty>No users</td></tr>";
  }catch(e){document.getElementById("msg").textContent=e.message||e;}
}
async function assignRole(){
  var uid=document.getElementById("uSel").value, role=document.getElementById("rSel").value;
  try{
    await DigiFyntekAPI.request("/api/v1/rbac/users/"+encodeURIComponent(uid)+"/role",{method:"PATCH",body:JSON.stringify({role:role})});
    document.getElementById("msg").textContent="Role updated: "+uid+" → "+role;
    loadUsers();
  }catch(e){document.getElementById("msg").textContent=e.message||e;}
}
async function grant(){
  var role=document.getElementById("gRole").value, perm=document.getElementById("gPerm").value;
  try{
    await DigiFyntekAPI.request("/api/v1/rbac/roles/"+encodeURIComponent(role)+"/permissions",{method:"POST",body:JSON.stringify({perm_code:perm})});
    document.getElementById("msg2").textContent="Granted "+perm+" to "+role;
    loadMatrix();
  }catch(e){document.getElementById("msg2").textContent=e.message||e;}
}
async function revoke(){
  var role=document.getElementById("gRole").value, perm=document.getElementById("gPerm").value;
  try{
    await DigiFyntekAPI.request("/api/v1/rbac/roles/"+encodeURIComponent(role)+"/permissions/"+encodeURIComponent(perm),{method:"DELETE"});
    document.getElementById("msg2").textContent="Revoked "+perm+" from "+role;
    loadMatrix();
  }catch(e){document.getElementById("msg2").textContent=e.message||e;}
}
async function loadMatrix(){
  try{
    var MATRIX=await DigiFyntekAPI.request("/api/v1/rbac/matrix");
    var roles=(MATRIX.roles||[]).map(function(r){return r.role_code;}).filter(function(c){return c!=="superadmin";});
    var perms=MATRIX.permissions||[];
    var m=MATRIX.matrix||{};
    var html="<table class=matrix><thead><tr><th class=perm>Permission</th>";
    roles.forEach(function(r){html+="<th>"+r+"</th>";});
    html+="</tr></thead><tbody>";
    perms.forEach(function(p){
      var code=p.perm_code;
      html+="<tr><td class=perm>"+code+"</td>";
      roles.forEach(function(r){
        var list=m[r]||[];
        var ok=list.indexOf("*")>=0||list.indexOf(code)>=0||r==="admin";
        html+="<td class="+(ok?"yes":"no")+">"+(ok?"✓":"·")+"</td>";
      });
      html+="</tr>";
    });
    html+="</tbody></table>";
    document.getElementById("matrixBox").innerHTML=html;
  }catch(e){document.getElementById("matrixBox").textContent=e.message||e;}
}
loadMe();
loadRolesPerms().then(function(){loadUsers();loadMatrix();}).catch(function(e){document.getElementById("msg").textContent=e.message||e;});
</script>
</body>
</html>
