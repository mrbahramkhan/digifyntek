openapi: 3.0.3
info:
  title: DigiFyntek CBS API
  version: "1.3.0"
  description: |
    Cooperative / banking platform API snapshot.
    Authenticate with `POST /api/auth/login`, then send `Authorization: Bearer <token>`.
    Sensitive routes require RBAC permissions (see `/api/v1/rbac/me`).
  contact:
    name: DigiFyntek
servers:
  - url: /
    description: Same origin / deployed host
tags:
  - name: Auth
  - name: CIF
  - name: KYC
  - name: Accounts
  - name: Ledger
  - name: Financing
  - name: TermDeposits
  - name: Approvals
  - name: Payments
  - name: Teller
  - name: Clearing
  - name: Reconciliation
  - name: EOD
  - name: RBAC
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    LoginRequest:
      type: object
      required: [userId, password]
      properties:
        userId: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            userId: { type: string }
            role: { type: string }
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login and obtain JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials

  /api/v1/cif:
    get:
      tags: [CIF]
      summary: List / search customers
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: Customer list }
    post:
      tags: [CIF]
      summary: Create customer
      responses:
        '201': { description: Created }

  /api/v1/cif/{id}:
    get:
      tags: [CIF]
      summary: Get customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Customer }
        '404': { description: Not found }

  /api/v1/kyc:
    get:
      tags: [KYC]
      summary: List KYC cases
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200': { description: Cases }
    post:
      tags: [KYC]
      summary: Open KYC case
      responses:
        '201': { description: Created }

  /api/v1/kyc/{id}/decide:
    post:
      tags: [KYC]
      summary: Approve or reject KYC (permission kyc.decide)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approved, rejected] }
                kyc_outcome: { type: string }
                note: { type: string }
      responses:
        '200': { description: Decided }
        '403': { description: Missing permission }

  /api/v1/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      responses:
        '200': { description: Accounts }
    post:
      tags: [Accounts]
      summary: Open account
      responses:
        '201': { description: Created }

  /api/v1/accounts/{id}/deposit:
    post:
      tags: [Accounts]
      summary: Cash deposit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
                business_date: { type: string, format: date }
      responses:
        '201': { description: Posted }

  /api/v1/accounts/{id}/withdraw:
    post:
      tags: [Accounts]
      summary: Cash withdrawal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Posted }
        '400': { description: Insufficient funds }

  /api/v1/ledger/journals:
    get:
      tags: [Ledger]
      summary: List journals
      responses:
        '200': { description: Journals }
    post:
      tags: [Ledger]
      summary: Post balanced journal (permission ledger.post)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_date: { type: string, format: date }
                narrative: { type: string }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      gl_code: { type: string }
                      debit: { type: number }
                      credit: { type: number }
                      account_id: { type: integer }
      responses:
        '201': { description: Posted }
        '400': { description: Unbalanced }

  /api/v1/ledger/journals/{id}/reverse:
    post:
      tags: [Ledger]
      summary: Reverse journal (permission ledger.reverse)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Reversal posted }

  /api/v1/ledger/trial-balance:
    get:
      tags: [Ledger]
      summary: Trial balance
      parameters:
        - in: query
          name: as_of
          schema: { type: string, format: date }
      responses:
        '200': { description: Trial balance }

  /api/v1/financing:
    get:
      tags: [Financing]
      summary: List financing contracts
      responses:
        '200': { description: Contracts }

  /api/v1/financing/disburse:
    post:
      tags: [Financing]
      summary: Disburse loan (permission loan.disburse)
      responses:
        '201': { description: Disbursed }

  /api/v1/financing/{id}/repay:
    post:
      tags: [Financing]
      summary: Repay loan (permission loan.repay)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Repaid }

  /api/v1/financing/{id}/schedule:
    post:
      tags: [Financing]
      summary: Generate repayment schedule
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Schedule created }

  /api/v1/term-deposits:
    get:
      tags: [TermDeposits]
      summary: List term deposits
      responses:
        '200': { description: TDs }
    post:
      tags: [TermDeposits]
      summary: Place TD (permission td.write)
      responses:
        '201': { description: Placed }

  /api/v1/term-deposits/{id}/mature:
    post:
      tags: [TermDeposits]
      summary: Mature TD
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Matured }

  /api/v1/term-deposits/{id}/premature:
    post:
      tags: [TermDeposits]
      summary: Premature encashment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '201': { description: Encashed }

  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval queue
      parameters:
        - in: query
          name: status
          schema: { type: string, default: PENDING }
      responses:
        '200': { description: Requests }
    post:
      tags: [Approvals]
      summary: Submit for maker-checker
      responses:
        '201': { description: Pending }

  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve and execute (permission approval.decide; maker≠checker)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Approved }
        '403': { description: Maker cannot self-approve }

  /api/v1/payments/raast/outbound:
    post:
      tags: [Payments]
      summary: Raast outbound SIMULATOR (permission payments.post)
      responses:
        '201': { description: Simulated payment }

  /api/v1/teller/drawers/open:
    post:
      tags: [Teller]
      summary: Open cash drawer (permission teller.ops)
      responses:
        '201': { description: Opened }

  /api/v1/teller/drawers/{id}/close:
    post:
      tags: [Teller]
      summary: Close drawer with counted cash
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Closed }

  /api/v1/clearing/batches:
    get:
      tags: [Clearing]
      summary: List clearing batches
      responses:
        '200': { description: Batches }
    post:
      tags: [Clearing]
      summary: Create INWARD or OUTWARD batch
      responses:
        '201': { description: Created }

  /api/v1/clearing/items/{id}/decide:
    post:
      tags: [Clearing]
      summary: Clear or bounce item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Decided }

  /api/v1/recon/statements:
    get:
      tags: [Reconciliation]
      summary: List recon statements
      responses:
        '200': { description: Statements }
    post:
      tags: [Reconciliation]
      summary: Create statement
      responses:
        '201': { description: Created }

  /api/v1/recon/statements/{id}/auto-match:
    post:
      tags: [Reconciliation]
      summary: Auto-match statement lines to journals
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Match result }

  /api/eod/status:
    get:
      tags: [EOD]
      summary: EOD status and gates
      responses:
        '200': { description: Status }

  /api/eod/run:
    post:
      tags: [EOD]
      summary: Run end of day (permission eod.run)
      responses:
        '200': { description: Result }
        '400': { description: Gate failed }

  /api/v1/rbac/me:
    get:
      tags: [RBAC]
      summary: Current user role and permissions
      responses:
        '200': { description: Me }

  /api/v1/rbac/matrix:
    get:
      tags: [RBAC]
      summary: Full role × permission matrix
      responses:
        '200': { description: Matrix }

  /health:
    get:
      tags: [Auth]
      security: []
      summary: Health check
      responses:
        '200': { description: OK }
