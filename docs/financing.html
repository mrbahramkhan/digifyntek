<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DigiFyntek — Financing Disbursement</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="side-brand"><span class="m">D</span> DigiFyntek</div><nav class="nav"></nav></aside>
  <div class="main">
    <header class="topbar">
      <h1>Loan / financing disbursement</h1>
      <span class="meta">GL: Dr 1100 · Cr Cash or deposit account</span>
    </header>
    <div class="workspace">
      <div class="split">
        <div class="panel">
          <div class="panel-h">Contracts</div>
          <div class="table-wrap">
            <table class="data">
              <thead><tr><th>Contract</th><th>Customer</th><th>Principal</th><th>OS</th><th>Status</th></tr></thead>
              <tbody id="tb"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h">Disburse</div>
          <div class="panel-b">
            <form id="frm">
              <div class="form-grid">
                <div class="field"><label>Customer ID <span class="req">*</span></label><input class="inp" id="f_cust" required /></div>
                <div class="field"><label>Product</label>
                  <select class="inp" id="f_prod">
                    <option value="LON-AGRI">LON-AGRI</option>
                    <option value="MUR-GOODS">MUR-GOODS (Islamic)</option>
                  </select>
                </div>
                <div class="field"><label>Principal PKR <span class="req">*</span></label><input class="inp" type="number" step="0.01" id="f_prin" required /></div>
                <div class="field"><label>Branch</label><input class="inp" id="f_br" value="001" /></div>
                <div class="field"><label>Credit to account ID</label><input class="inp" id="f_acct" placeholder="Optional CASA id" /></div>
                <div class="field"><label>Business date</label><input class="inp" type="date" id="f_date" /></div>
                <div class="field full"><label>Narrative</label><input class="inp" id="f_narr" /></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn btn-p">Disburse</button></div>
              <div id="msg" class="hint"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="config.js"></script><script src="js/api.js"></script><script src="js/shell.js"></script>
<script>
document.getElementById('f_date').value=new Date().toISOString().slice(0,10);
async function load(){
  try{
    const rows=await DigiFyntekAPI.request('/api/v1/financing');
    document.getElementById('tb').innerHTML=rows.length?rows.map(r=>
      '<tr><td class="num">'+r.contract_no+'</td><td>'+(r.full_name||r.customer_id)+'</td><td class="num">'+Number(r.principal).toLocaleString()+'</td><td class="num">'+Number(r.outstanding).toLocaleString()+'</td><td>'+r.status+'</td></tr>'
    ).join(''):'<tr><td colspan="5" class="empty">No contracts yet</td></tr>';
  }catch(e){document.getElementById('tb').innerHTML='<tr><td colspan="5" class="empty">'+e.message+'</td></tr>';}
}
document.getElementById('frm').onsubmit=async e=>{
  e.preventDefault();const msg=document.getElementById('msg');msg.textContent='…';
  try{
    const r=await DigiFyntekAPI.request('/api/v1/financing/disburse',{method:'POST',body:JSON.stringify({
      customer_id:Number(f_cust.value),product_code:f_prod.value,principal:Number(f_prin.value),
      branch_code:f_br.value,credit_account_id:f_acct.value?Number(f_acct.value):null,
      business_date:f_date.value,narrative:f_narr.value,
      is_islamic:f_prod.value.indexOf('MUR')===0
    })});
    msg.textContent='Disbursed '+r.contract_no+' · journal '+(r.journal&&r.journal.journal_ref);msg.className='ok';
    load();
  }catch(err){msg.textContent=err.message;msg.className='err';}
};
load();
</script>
</body>
</html>
